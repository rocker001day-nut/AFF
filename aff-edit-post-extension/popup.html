<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFF Edit Post Assistant</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
<span class="tag">AFF · EDIT POST</span>
<h1>ตัวช่วยแก้ลิงก์โพสต์</h1>
<p>เปิดคิว AFF เลือกโพสต์ แล้วกด “ให้ส่วนขยายช่วยแก้” ส่วนขยายจะเปิดโพสต์ Facebook ใน Chrome นี้</p>
<p class="note">ต้องล็อกอิน Facebook ใน Chrome และมีสิทธิ์แก้ไขโพสต์หรือคอมเมนต์ของเพจ ระบบจะเติมลิงก์ในช่องแก้ไขที่เปิดอยู่ คุณตรวจและกดบันทึกบน Facebook เอง</p>
<button id="openAFF" type="button">เปิดคิวแก้โพสต์ AFF</button>
<button id="openFacebook" class="secondary" type="button">เปิด Facebook</button>
</main><script src="popup.js"></script></body></html>
