<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AFF Facebook Check</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <span class="tag">AFF · FACEBOOK</span>
    <h1>เช็ก Facebook ใน Chrome</h1>
    <p id="status" role="status" aria-live="polite">กำลังตรวจสถานะ…</p>
    <p class="hint">ส่วนขยายตรวจเพียงว่ามีการล็อกอินอยู่ ไม่อ่านหรือส่งค่าคุกกี้ให้เว็บ การดึงเพจและโพสต์ต้องผ่านการอนุญาตบัญชีบน AFF</p>
    <button id="openAFF" type="button">เชื่อม Facebook และดึงเพจ</button>
    <button id="openFacebook" class="secondary" type="button">เปิด Facebook</button>
    <button id="refresh" class="text" type="button">ตรวจอีกครั้ง</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
